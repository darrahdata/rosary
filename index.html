<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8f5f0">
<title>The Rosary &middot; A Contemplative Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ivory:        #f8f5f0;
  --ivory-2:      #f1ede4;
  --surface:      #ffffff;
  --hairline:     rgba(60,60,67,0.12);
  --hairline-2:   rgba(60,60,67,0.18);
  --blue:         #4a6fa5;
  --blue-dark:    #2c4a7c;
  --blue-pale:    #eef3f9;
  --blue-tint:    rgba(74,111,165,0.08);
  --label:        #1d1d1f;
  --label-2:      #3c3c43;
  --label-3:      rgba(60,60,67,0.6);
  --label-4:      rgba(60,60,67,0.4);
  --red:          #d9533a;
  --shadow-1:     0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.03);
  --shadow-2:     0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-3:     0 10px 30px rgba(30,45,64,0.08), 0 2px 8px rgba(0,0,0,0.04);
  --radius-sm:    10px;
  --radius:       14px;
  --radius-lg:    18px;
  --radius-xl:    22px;
  --ease:         cubic-bezier(0.4, 0, 0.2, 1);
  --spring:       cubic-bezier(0.32, 0.72, 0, 1);
  --serif:        'Cormorant Garamond', 'New York', 'Iowan Old Style', Georgia, serif;
  --sf:           -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--sf);
  font-size: 17px;
  line-height: 1.45;
  background: var(--ivory);
  color: var(--label);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(4rem, env(safe-area-inset-bottom));
}

button { font: inherit; color: inherit; }

/* ── Header ─────────────────────────────────────── */
.app-header {
  text-align: center;
  margin-bottom: 2.25rem;
}
.app-header h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(2rem, 5.5vw, 2.6rem);
  letter-spacing: -0.005em;
  color: var(--blue-dark);
  line-height: 1.1;
}
.app-header p {
  font-size: 0.95rem;
  color: var(--label-3);
  margin-top: 0.3rem;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.header-rule {
  width: 36px;
  height: 2px;
  background: var(--blue);
  opacity: 0.3;
  margin: 0.85rem auto 0;
  border-radius: 1px;
}

/* ── Screens ─────────────────────────────────────── */
.screen { display: none; width: 100%; max-width: 540px; }
.screen.active { display: block; animation: fadeIn 0.32s var(--spring); }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Setup Sections ──────────────────────────────── */
.setup-section { margin-bottom: 1.65rem; }
.setup-label {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--label-3);
  margin: 0 0.25rem 0.6rem;
}

/* Prayer-type list (full-width cards) */
.type-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 0.35rem;
  box-shadow: var(--shadow-1);
}
.type-card {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.9rem 1rem;
  background: transparent;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: background 0.18s var(--ease);
}
.type-card:hover { background: var(--ivory-2); }
.type-card.selected { background: var(--blue-tint); }
.type-card-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline-2);
  flex-shrink: 0;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.18s, background 0.18s;
}
.type-card.selected .type-card-dot {
  border-color: var(--blue);
  background: var(--blue);
}
.type-card.selected .type-card-dot::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--surface);
}
.type-card-text { flex: 1; min-width: 0; }
.type-card-text strong {
  display: block;
  font-weight: 600;
  font-size: 1.02rem;
  letter-spacing: -0.01em;
  color: var(--label);
}
.type-card-text small {
  display: block;
  font-size: 0.84rem;
  color: var(--label-3);
  margin-top: 1px;
  letter-spacing: -0.005em;
}
.type-card.selected .type-card-text strong { color: var(--blue-dark); }

/* Mystery grid */
.mystery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}
.mystery-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 0.95rem 1rem 0.9rem;
  cursor: pointer;
  text-align: left;
  color: var(--label);
  font-family: inherit;
  font-size: 0.97rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.25;
  transition: border-color 0.18s, background 0.18s, transform 0.12s var(--spring);
  box-shadow: var(--shadow-1);
}
.mystery-card:hover { background: var(--ivory-2); }
.mystery-card:active { transform: scale(0.98); }
.mystery-card.selected {
  border-color: var(--blue);
  background: var(--blue-tint);
  color: var(--blue-dark);
  box-shadow: 0 0 0 3px var(--blue-tint), var(--shadow-1);
}
.mystery-card small {
  display: block;
  font-size: 0.78rem;
  color: var(--label-3);
  font-weight: 400;
  margin-top: 3px;
}
.mystery-card.selected small { color: var(--blue); }

/* One-decade list - all 20 mysteries grouped */
.decade-group {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 0.5rem;
  box-shadow: var(--shadow-1);
  margin-bottom: 0.5rem;
}
.decade-group-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--blue);
  padding: 0.4rem 0.6rem 0.3rem;
}
.decade-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  width: 100%;
  padding: 0.7rem 0.7rem;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  font-size: 0.95rem;
  font-family: inherit;
  color: var(--label);
  transition: background 0.15s var(--ease);
  letter-spacing: -0.005em;
}
.decade-item:hover { background: var(--ivory-2); }
.decade-item.selected { background: var(--blue-tint); color: var(--blue-dark); font-weight: 500; }
.decade-item-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--ivory-2);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--label-3);
  flex-shrink: 0;
}
.decade-item.selected .decade-item-num { background: var(--blue); color: var(--surface); }

/* Advance grid */
.advance-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}
.advance-btn {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.97rem;
  font-weight: 500;
  color: var(--label);
  text-align: left;
  line-height: 1.25;
  letter-spacing: -0.01em;
  transition: border-color 0.18s, background 0.18s, transform 0.12s var(--spring);
  box-shadow: var(--shadow-1);
}
.advance-btn:hover { background: var(--ivory-2); }
.advance-btn:active { transform: scale(0.98); }
.advance-btn.selected {
  border-color: var(--blue);
  background: var(--blue-tint);
  color: var(--blue-dark);
  box-shadow: 0 0 0 3px var(--blue-tint), var(--shadow-1);
}
.advance-btn small {
  display: block;
  font-size: 0.78rem;
  color: var(--label-3);
  font-weight: 400;
  margin-top: 2px;
}
.advance-btn.selected small { color: var(--blue); }

/* Video join button */
.video-join-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.85rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  color: var(--blue);
  font-family: inherit;
  font-size: 0.97rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: background 0.18s, border-color 0.18s, transform 0.12s var(--spring);
  box-shadow: var(--shadow-1);
}
.video-join-btn:hover { background: var(--blue-pale); border-color: var(--blue); }
.video-join-btn:active { transform: scale(0.98); }

/* Start button (filled, primary) */
.start-btn {
  width: 100%;
  padding: 1.05rem 1.5rem;
  background: var(--blue);
  color: var(--surface);
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  margin-top: 1.5rem;
  transition: background 0.18s, transform 0.12s var(--spring), box-shadow 0.18s;
  box-shadow: 0 3px 12px rgba(74,111,165,0.22);
}
.start-btn:hover { background: var(--blue-dark); box-shadow: 0 5px 18px rgba(44,74,124,0.28); }
.start-btn:active { transform: scale(0.98); }
.start-btn:disabled {
  background: var(--hairline);
  color: var(--label-4);
  cursor: default;
  box-shadow: none;
  transform: none;
}

/* ── Prayer Screen ───────────────────────────────── */
.back-btn {
  background: none;
  border: none;
  color: var(--blue);
  font-family: inherit;
  font-size: 0.97rem;
  font-weight: 400;
  cursor: pointer;
  padding: 0.4rem 0;
  margin-bottom: 0.6rem;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  transition: opacity 0.18s;
}
.back-btn:hover { opacity: 0.7; }

.prayer-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.5rem;
  gap: 0.5rem;
}
.mystery-name {
  font-family: var(--serif);
  font-size: 1.2rem;
  color: var(--blue-dark);
  letter-spacing: -0.005em;
}
.progress-text {
  font-size: 0.78rem;
  color: var(--label-3);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  flex-shrink: 0;
}

/* Artwork frame */
.art-wrap {
  margin-bottom: 0.75rem;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--ivory-2);
  position: relative;
  height: 200px;
  box-shadow: var(--shadow-2);
}
.art-wrap.hidden { display: none; }
.art-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 28%;
  display: block;
  opacity: 0;
  transition: opacity 0.6s var(--ease);
}
.art-wrap img.loaded { opacity: 1; }
.art-credit {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1.4rem 0.85rem 0.55rem;
  font-size: 0.74rem;
  color: rgba(255,255,255,0.95);
  background: linear-gradient(transparent, rgba(15,20,30,0.62));
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1.3;
}

/* Rosary SVG */
#rosary-svg {
  width: 100%;
  max-width: 290px;
  margin: 0.25rem auto 0.6rem;
  display: block;
  overflow: visible;
}
#rosary-svg.hidden { display: none; }
.rb-chain { fill: none; stroke: #c4cdd8; stroke-width: 1.2; }
.rb-bead { transition: filter 0.5s var(--ease); }
.rb-bead circle {
  fill: url(#grad-undone);
  stroke: #c0bab2;
  stroke-width: 1.2;
  transition: fill 0.5s var(--ease), stroke 0.5s var(--ease);
}
.rb-bead.done circle { fill: url(#grad-done); stroke: #6a90b8; }
.rb-bead.current circle { fill: url(#grad-current); stroke: #2c4a7c; stroke-width: 1.6; }
.rb-bead.current { animation: bead-glow 2.2s ease-in-out infinite; }
@keyframes bead-glow {
  0%,100% { filter: drop-shadow(0 0 3px rgba(74,111,165,0.4)); }
  50%     { filter: drop-shadow(0 0 10px rgba(74,111,165,0.85)); }
}
.rb-cross { transition: filter 0.5s var(--ease); }
.rb-cross line {
  stroke: #c4cdd8;
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke 0.5s var(--ease);
}
.rb-cross.done line { stroke: var(--blue); }
.rb-cross.current line { stroke: var(--blue-dark); }
.rb-cross.current { animation: bead-glow 2.2s ease-in-out infinite; }

/* Prayer card */
.prayer-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.4rem;
  margin-bottom: 1rem;
  min-height: 120px;
  box-shadow: var(--shadow-2);
}
.prayer-type {
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 0.35rem;
  font-weight: 600;
}
.prayer-name {
  font-family: var(--serif);
  font-size: 1.65rem;
  color: var(--blue-dark);
  margin-bottom: 0.8rem;
  font-weight: 400;
  letter-spacing: -0.005em;
  line-height: 1.15;
}
#prayer-text {
  font-family: var(--serif);
  font-size: 1.12rem;
  line-height: 1.62;
  color: var(--label);
  font-weight: 400;
}
/* Word highlighting in voice mode */
.pw { transition: color 0.12s var(--ease); }
body.voice-active #prayer-text .pw { color: var(--label-4); }
body.voice-active #prayer-text .pw.spoken { color: var(--blue-dark); }

.mystery-text {
  font-size: 0.9rem;
  font-style: italic;
  color: var(--label-3);
  margin-top: 0.85rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--hairline);
  letter-spacing: -0.005em;
}

/* Controls */
.controls {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  margin-bottom: 0.6rem;
}
.ctrl-btn {
  flex: 1;
  padding: 0.95rem 1rem;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, transform 0.12s var(--spring);
  min-height: 54px;
}
.btn-prev {
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--label-2);
  box-shadow: var(--shadow-1);
}
.btn-prev:hover { background: var(--ivory-2); }
.btn-prev:active { transform: scale(0.97); }
.btn-next {
  background: var(--blue);
  border: 1px solid var(--blue);
  color: var(--surface);
  box-shadow: 0 3px 12px rgba(74,111,165,0.22);
}
.btn-next:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn-next:active { transform: scale(0.97); }

.mic-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--label-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.18s, color 0.18s, transform 0.12s var(--spring);
  box-shadow: var(--shadow-1);
}
.mic-btn:hover { color: var(--blue); border-color: var(--blue); }
.mic-btn:active { transform: scale(0.95); }
.mic-btn.listening {
  border-color: var(--red);
  color: var(--red);
  animation: mic-pulse 1.4s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(217,83,58,0); }
  50%     { box-shadow: 0 0 0 7px rgba(217,83,58,0.14); }
}

.status-bar {
  font-size: 0.85rem;
  color: var(--label-3);
  text-align: center;
  min-height: 1.2em;
  letter-spacing: -0.005em;
  font-weight: 400;
}
.status-bar.active { color: var(--blue); font-weight: 500; }

.video-link-small {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.85rem;
  color: var(--label-3);
  text-decoration: none;
  font-weight: 400;
  transition: color 0.18s;
}
.video-link-small:hover { color: var(--blue); }

/* ── Complete Screen ─────────────────────────────── */
.complete-card {
  background: var(--surface);
  border-radius: var(--radius-xl);
  padding: 3rem 2rem;
  text-align: center;
  box-shadow: var(--shadow-3);
}
.complete-card h2 {
  font-family: var(--serif);
  font-size: 2.2rem;
  color: var(--blue-dark);
  font-weight: 400;
  margin-bottom: 0.9rem;
  letter-spacing: -0.005em;
}
.complete-rule {
  width: 36px;
  height: 2px;
  background: var(--blue);
  opacity: 0.3;
  margin: 0 auto 1rem;
  border-radius: 1px;
}
.complete-card p {
  font-family: var(--serif);
  color: var(--label-2);
  font-style: italic;
  line-height: 1.7;
  font-size: 1.05rem;
}
.restart-btn {
  margin-top: 1.85rem;
  padding: 0.85rem 2.25rem;
  background: var(--blue);
  border: none;
  color: var(--surface);
  font-family: inherit;
  font-size: 1.02rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius);
  letter-spacing: -0.01em;
  transition: background 0.18s, transform 0.12s var(--spring), box-shadow 0.18s;
  box-shadow: 0 3px 12px rgba(74,111,165,0.22);
}
.restart-btn:hover { background: var(--blue-dark); box-shadow: 0 5px 18px rgba(44,74,124,0.28); }
.restart-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<header class="app-header">
  <h1>The Rosary</h1>
  <p>A contemplative companion for prayer</p>
  <div class="header-rule"></div>
</header>

<!-- ── Setup Screen ─────────────────────────────── -->
<div class="screen active" id="screen-setup">

  <div class="setup-section">
    <div class="setup-label">Choose a prayer</div>
    <div class="type-list" id="type-list"></div>
  </div>

  <div class="setup-section" id="mystery-section" style="display:none">
    <div class="setup-label">Choose mysteries</div>
    <div class="mystery-grid">
      <button class="mystery-card" data-mystery="joyful" onclick="selectMystery(this)">
        Joyful<small>Monday &amp; Saturday</small>
      </button>
      <button class="mystery-card" data-mystery="sorrowful" onclick="selectMystery(this)">
        Sorrowful<small>Tuesday &amp; Friday</small>
      </button>
      <button class="mystery-card" data-mystery="glorious" onclick="selectMystery(this)">
        Glorious<small>Wednesday &amp; Sunday</small>
      </button>
      <button class="mystery-card" data-mystery="luminous" onclick="selectMystery(this)">
        Luminous<small>Thursday</small>
      </button>
    </div>
  </div>

  <div class="setup-section" id="decade-section" style="display:none">
    <div class="setup-label">Choose a single mystery</div>
    <div id="decade-groups"></div>
  </div>

  <div class="setup-section" id="advance-section">
    <div class="setup-label">Advance beads by</div>
    <div class="advance-grid">
      <button class="advance-btn selected" data-advance="tap" onclick="selectAdvance(this)">
        Tap &middot; click<small>Manual advance</small>
      </button>
      <button class="advance-btn" data-advance="voice" onclick="selectAdvance(this)">
        Voice<small>Auto-advance as you pray</small>
      </button>
    </div>
  </div>

  <div class="setup-section">
    <div class="setup-label">Pray together</div>
    <a class="video-join-btn" href="https://meet.google.com/kjz-oeov-nuj" target="_blank" rel="noopener">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      Join video call
    </a>
  </div>

  <button class="start-btn" id="start-btn" onclick="startPrayer()" disabled>Begin</button>

// ── Sequence Builders ───────────────────────────────
function buildRosary(mysteryKey) {
  const m = MYSTERIES[mysteryKey].list;
  const s = [];
  s.push({ ...PRAYERS.apostlesCreed });
  s.push({ ...PRAYERS.ourFather });
  s.push({ ...PRAYERS.hailMary, sub: 'For an increase in Faith' });
  s.push({ ...PRAYERS.hailMary, sub: 'For an increase in Hope' });
  s.push({ ...PRAYERS.hailMary, sub: 'For an increase in Charity' });
  s.push({ ...PRAYERS.gloryBe });
  for (let d = 0; d < 5; d++) {
    s.push({ ...PRAYERS.ourFather, mystery: m[d], decade: d+1, artIdx: d });
    for (let h = 0; h < 10; h++) s.push({ ...PRAYERS.hailMary, mystery: m[d], artIdx: d });
    s.push({ ...PRAYERS.gloryBe, mystery: m[d], artIdx: d });
    s.push({ ...PRAYERS.fatima, mystery: m[d], artIdx: d });
  }
  s.push({ ...PRAYERS.hailHolyQueen });
  return s;
}

function buildOneDecade(mysteryKey, decadeIdx) {
  const mysteryName = MYSTERIES[mysteryKey].list[decadeIdx];
  const s = [];
  s.push({ ...PRAYERS.apostlesCreed });
  s.push({ ...PRAYERS.ourFather, mystery: mysteryName, decade: 1, artIdx: decadeIdx });
  for (let h = 0; h < 10; h++) s.push({ ...PRAYERS.hailMary, mystery: mysteryName, artIdx: decadeIdx });
  s.push({ ...PRAYERS.gloryBe, mystery: mysteryName, artIdx: decadeIdx });
  s.push({ ...PRAYERS.fatima, mystery: mysteryName, artIdx: decadeIdx });
  s.push({ ...PRAYERS.hailHolyQueen });
  return s;
}

function buildFranciscan() {
  const s = [];
  s.push({ ...PRAYERS.apostlesCreed });
  for (let d = 0; d < 7; d++) {
    s.push({ ...PRAYERS.ourFather, mystery: FRANCISCAN_JOYS[d], decade: d+1, artIdx: d });
    for (let h = 0; h < 10; h++) s.push({ ...PRAYERS.hailMary, mystery: FRANCISCAN_JOYS[d], artIdx: d });
    s.push({ ...PRAYERS.gloryBe, mystery: FRANCISCAN_JOYS[d], artIdx: d });
  }
  s.push({ ...PRAYERS.hailMary, sub: 'In honor of Mary’s 72 years on earth (1 of 2)' });
  s.push({ ...PRAYERS.hailMary, sub: 'In honor of Mary’s 72 years on earth (2 of 2)' });
  return s;
}

function buildChaplet() {
  const s = [];

  for (let d = 0; d < 5; d++) {
    s.push({ ...PRAYERS.eternalFather, decade: d+1, artIdx: 0 });
    for (let h = 0; h < 10; h++) s.push({ ...PRAYERS.sorrowfulPassion, artIdx: 0 });
  }
  s.push({ ...PRAYERS.holyGod, sub: '1 of 3' });
  s.push({ ...PRAYERS.holyGod, sub: '2 of 3' });
  s.push({ ...PRAYERS.holyGod, sub: '3 of 3' });
  return s;
}

function buildServite() {
  const s = [];
  s.push({ ...PRAYERS.apostlesCreed });
  for (let d = 0; d < 7; d++) {
    s.push({ ...PRAYERS.ourFather, mystery: SERVITE_SORROWS[d], decade: d+1, artIdx: d });
    for (let h = 0; h < 7; h++) s.push({ ...PRAYERS.hailMary, mystery: SERVITE_SORROWS[d], artIdx: d });
  }
  s.push({ ...PRAYERS.hailMary, sub: 'In honor of Mary’s tears (1 of 3)' });
  s.push({ ...PRAYERS.hailMary, sub: 'In honor of Mary’s tears (2 of 3)' });
  s.push({ ...PRAYERS.hailMary, sub: 'In honor of Mary’s tears (3 of 3)' });
  return s;
}

function buildSingle(prayerKey) {

// ── Type selection rendering ────────────────────────
function renderTypeList() {
  const wrap = document.getElementById('type-list');
  wrap.innerHTML = '';
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'type-card';
    btn.dataset.type = t.id;
    btn.onclick = () => selectType(btn);
    btn.innerHTML = `
      <span class="type-card-dot"></span>
      <span class="type-card-text">
        <strong>${t.title}</strong>
        <small>${t.subtitle}</small>
      </span>`;
    wrap.appendChild(btn);
  });
}

function renderDecadePicker() {
  const wrap = document.getElementById('decade-groups');
  wrap.innerHTML = '';
  Object.entries(MYSTERIES).forEach(([key, set]) => {
    const group = document.createElement('div');
    group.className = 'decade-group';
    const label = document.createElement('div');
    label.className = 'decade-group-label';
    label.textContent = set.name;
    group.appendChild(label);
    set.list.forEach((mystery, idx) => {
      const item = document.createElement('button');
      item.className = 'decade-item';
      item.dataset.mysteryKey = key;
      item.dataset.decadeIdx = idx;
      item.onclick = () => selectDecade(item);
      item.innerHTML = `
        <span class="decade-item-num">${idx+1}</span>
        <span>${mystery}</span>`;
      group.appendChild(item);
    });
    wrap.appendChild(group);
  });
}

function getType(id) { return TYPES.find(t => t.id === id); }

function selectType(btn) {
  document.querySelectorAll('.type-card').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections.type = btn.dataset.type;
  const t = getType(selections.type);
  document.getElementById('mystery-section').style.display = t.needsMystery ? 'block' : 'none';
  document.getElementById('decade-section').style.display  = t.needsDecade  ? 'block' : 'none';
  // Reset other selections when switching types
  if (!t.needsMystery) {
    selections.mystery = null;
    document.querySelectorAll('.mystery-card.selected').forEach(b => b.classList.remove('selected'));
  }
  if (!t.needsDecade) {
    selections.decade = null;
    document.querySelectorAll('.decade-item.selected').forEach(b => b.classList.remove('selected'));
  }
  updateStartBtn();
}

function selectMystery(btn) {
  document.querySelectorAll('.mystery-card').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections.mystery = btn.dataset.mystery;
  updateStartBtn();
}

function selectDecade(btn) {
  document.querySelectorAll('.decade-item').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections.decade = { key: btn.dataset.mysteryKey, idx: parseInt(btn.dataset.decadeIdx, 10) };
  updateStartBtn();
}

function selectAdvance(btn) {
  document.querySelectorAll('.advance-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections.advance = btn.dataset.advance;
}

function updateStartBtn() {
  if (!selections.type) { document.getElementById('start-btn').disabled = true; return; }
  const t = getType(selections.type);
  const ok = (!t.needsMystery || selections.mystery) && (!t.needsDecade || selections.decade);
  document.getElementById('start-btn').disabled = !ok;
}

// ── Start ───────────────────────────────────────────
function startPrayer() {
  state.typeId      = selections.type;
  state.mysteryKey  = selections.mystery;
  state.decadeIdx   = selections.decade ? selections.decade.idx : null;
  state.advanceMode = selections.advance;
  state.currentIndex = 0;
  state.listening = false;

  switch (state.typeId) {
    case 'rosary':       state.sequence = buildRosary(state.mysteryKey); break;
    case 'one-decade':   state.sequence = buildOneDecade(selections.decade.key, selections.decade.idx); state.mysteryKey = selections.decade.key; break;
    case 'franciscan':   state.sequence = buildFranciscan(); break;
    case 'chaplet':      state.sequence = buildChaplet(); break;
    case 'servite':      state.sequence = buildServite(); break;
    case 'grace-before': state.sequence = buildSingle('graceBefore'); break;
    case 'grace-after':  state.sequence = buildSingle('graceAfter'); break;
    case 'healing':      state.sequence = buildSingle('stRaphael'); break;
  }

  svgBuilt = false;
  showScreen('screen-prayer');
  const t = getType(state.typeId);
  document.getElementById('rosary-svg').classList.toggle('hidden', !t.bead);
  renderPrayer();
  if (state.advanceMode === 'voice') setTimeout(() => startListening(), 500);
}

function showSetup() {
  stopListening();
  document.body.classList.remove('voice-active');
  showScreen('screen-setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Render Prayer ───────────────────────────────────
function getTitle() {
  if (state.typeId === 'rosary')     return MYSTERIES[state.mysteryKey].name;
  if (state.typeId === 'one-decade') return MYSTERIES[state.mysteryKey].name + ' · One Decade';
  const t = getType(state.typeId);
  return t ? t.title : '';
}

function renderPrayer() {
  const step = state.sequence[state.currentIndex];
  document.getElementById('mystery-label').textContent  = getTitle();
  document.getElementById('progress-label').textContent = (state.currentIndex + 1) + ' / ' + state.sequence.length;
  document.getElementById('prayer-type').textContent    = step.type || '';
  document.getElementById('prayer-name').textContent    = step.name || '';

  // Word spans for highlighting
  const prayerEl = document.getElementById('prayer-text');
  const words = (step.text || '').split(/\s+/).filter(Boolean);
  prayerEl.innerHTML = words.map(w => `<span class="pw">${escapeHTML(w)}</span>`).join(' ');

  const mystEl = document.getElementById('mystery-text');
  if (step.mystery) {
    mystEl.style.display = 'block';
    mystEl.textContent = (step.decade ? step.decade + '. ' : '') + step.mystery;
  } else if (step.sub) {
    mystEl.style.display = 'block';
    mystEl.textContent = step.sub;
  } else {
    mystEl.style.display = 'none';
  }

  renderArt(step);
  renderBeads();
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderArt(step) {
  const wrap = document.getElementById('art-wrap');
  const img = document.getElementById('art-img');
  const credit = document.getElementById('art-credit');
  const t = getType(state.typeId);
  let artData = null;
  if (t && t.art && step.artIdx != null) {
    const key = t.art === 'mystery' ? state.mysteryKey : t.art;
    artData = ART[key] && ART[key][step.artIdx];
  }
  if (artData) {
    if (img.src !== artData.url) {
      img.classList.remove('loaded');
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => wrap.classList.add('hidden');
      img.src = artData.url;
      img.alt = artData.credit;
    }
    credit.innerHTML = artData.credit;
    wrap.classList.remove('hidden');
  } else {
    wrap.classList.add('hidden');
  }
}

// ── SVG Rosary ──────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const R_CX = 170, R_CY = 148, R_RX = 125, R_RY = 102, R_JY = 250;
const PENDANT_POS = [
  { seq: 5, y: 276, r: 4.5 },
  { seq: 4, y: 298, r: 4.5 },
  { seq: 3, y: 318, r: 4.5 },
  { seq: 2, y: 338, r: 4.5 },
  { seq: 1, y: 362, r: 7   },
];
const OF_CIRCLE = new Set([0, 13, 26, 39, 52]);

function mkEl(tag) { return document.createElementNS(SVG_NS, tag); }

function addBead(svg, seqIdx, x, y, r) {
  const g = mkEl('g');
  g.setAttribute('id', 'rb-' + seqIdx);
  g.setAttribute('class', 'rb-bead');
  const c = mkEl('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  g.appendChild(c);
  svg.appendChild(g);
}

function buildRosarySVG() {
  const svg = document.getElementById('rosary-svg');
  svg.innerHTML = '';
  const defs = mkEl('defs');
  defs.innerHTML = `
    <radialGradient id="grad-undone" cx="35%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#beb8b0"/>
    </radialGradient>
    <radialGradient id="grad-done" cx="35%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#ddeaf8"/>
      <stop offset="55%"  stop-color="#8aaac8"/>
      <stop offset="100%" stop-color="#3d5c8e"/>
    </radialGradient>
    <radialGradient id="grad-current" cx="32%" cy="26%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#c8dcf2"/>
      <stop offset="100%" stop-color="#2c4a7c"/>
    </radialGradient>`;
  svg.appendChild(defs);

  const ell = mkEl('ellipse');
  ell.setAttribute('cx', R_CX); ell.setAttribute('cy', R_CY);
  ell.setAttribute('rx', R_RX); ell.setAttribute('ry', R_RY);
  ell.setAttribute('class', 'rb-chain');
  svg.appendChild(ell);

  const chainYs = [R_JY, ...PENDANT_POS.map(p => p.y), 383];
  for (let i = 0; i < chainYs.length - 1; i++) {
    const ln = mkEl('line');
    ln.setAttribute('x1', R_CX); ln.setAttribute('y1', chainYs[i]);
    ln.setAttribute('x2', R_CX); ln.setAttribute('y2', chainYs[i + 1]);
    ln.setAttribute('class', 'rb-chain');
    svg.appendChild(ln);
  }

  const crossG = mkEl('g');
  crossG.setAttribute('id', 'rb-0');
  crossG.setAttribute('class', 'rb-cross');
  const vBar = mkEl('line');
  vBar.setAttribute('x1', R_CX);      vBar.setAttribute('y1', 383);
  vBar.setAttribute('x2', R_CX);      vBar.setAttribute('y2', 414);
  const hBar = mkEl('line');
  hBar.setAttribute('x1', R_CX - 12); hBar.setAttribute('y1', 391);
  hBar.setAttribute('x2', R_CX + 12); hBar.setAttribute('y2', 391);
  crossG.appendChild(vBar); crossG.appendChild(hBar);
  svg.appendChild(crossG);

  addBead(svg, 71, R_CX, R_JY, 9);
  for (const p of PENDANT_POS) addBead(svg, p.seq, R_CX, p.y, p.r);

  // Loop beads — start at bottom (near junction), sweep up the RIGHT side first.
  // SVG +Y is downward, so subtracting the step from π/2 moves clockwise visually.
  const step = (2 * Math.PI) / 66;
  for (let i = 0; i < 65; i++) {
    const angle = Math.PI / 2 - (i + 1) * step;
    addBead(svg, 6 + i,
      R_CX + R_RX * Math.cos(angle),
      R_CY + R_RY * Math.sin(angle),
      OF_CIRCLE.has(i) ? 7 : 4.5);
  }

  svgBuilt = true;
}

function renderBeads() {
  const svg = document.getElementById('rosary-svg');
  if (svg.classList.contains('hidden')) return;
  if (!svgBuilt) buildRosarySVG();

  // Map currentIndex proportionally to the 72 SVG positions (rb-0..71)
  const total = state.sequence.length;
  let mapped;
  if (total <= 1) mapped = state.currentIndex;
  else if (total <= 72) mapped = state.currentIndex;
  else mapped = Math.round(state.currentIndex * 71 / (total - 1));

  const cross = document.getElementById('rb-0');
  if (cross) cross.setAttribute('class',
    'rb-cross' + (mapped === 0 ? ' current' : mapped > 0 ? ' done' : ''));
  for (let s = 1; s <= 71; s++) {
    const b = document.getElementById('rb-' + s);
    if (b) b.setAttribute('class',
      'rb-bead' + (s === mapped ? ' current' : s < mapped ? ' done' : ''));
  }
}

// ── Navigation ──────────────────────────────────────
function nextBead() {
  if (state.currentIndex < state.sequence.length - 1) {
    state.currentIndex++;
    renderPrayer();
  } else {
    stopListening();
    showScreen('screen-complete');
  }
}
function prevBead() {
  if (state.currentIndex > 0) { state.currentIndex--; renderPrayer(); }
}

// ── Voice Recognition ──────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleMic() {
  if (state.listening) {
    stopListening();
    updateStatus('Voice paused — tap next or enable voice again', false);
  } else {
    startListening();
  }
}

function highlightWords(count) {
  const spans = document.querySelectorAll('#prayer-text .pw');
  spans.forEach((s, i) => s.classList.toggle('spoken', i < count));
}

function startListening() {
  if (!SpeechRecognition) { updateStatus('Voice not supported — use Chrome or Edge', false); return; }
  if (recog) { try { recog.stop(); } catch(e){} }
  recog = new SpeechRecognition();
  recog.continuous = true;
  recog.interimResults = true;
  recog.lang = 'en-US';
  recog.onstart = () => {
    state.listening = true;
    document.body.classList.add('voice-active');
    document.getElementById('mic-btn').classList.add('listening');
    updateStatus('Listening — pray aloud to advance', true);
  };
  recog.onresult = (e) => {
    // Count words across all current results (final + interim)
    let total = 0, finalWords = 0;
    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      const wc = t ? t.split(/\s+/).length : 0;
      total += wc;
      if (e.results[i].isFinal) finalWords += wc;
    }
    highlightWords(total);
    if (finalWords > 8) {
      // Restart for clean state, then advance
      try { recog.stop(); } catch(_) {}
      nextBead();
    }
  };
  recog.onerror = (e) => {
    if (e.error !== 'no-speech') {
      state.listening = false;
      document.body.classList.remove('voice-active');
      document.getElementById('mic-btn').classList.remove('listening');
      updateStatus('Voice error — tap mic to retry', false);
    }
  };
  recog.onend = () => {
    if (state.listening) {
      setTimeout(() => { try { recog.start(); } catch(e){} }, 80);
    } else {
      document.body.classList.remove('voice-active');
      document.getElementById('mic-btn').classList.remove('listening');
    }
  };
  try { recog.start(); } catch(e) { updateStatus('Could not start microphone', false); }
}

function stopListening() {
  state.listening = false;
  if (recog) { try { recog.stop(); } catch(e){} recog = null; }
  document.body.classList.remove('voice-active');
  const btn = document.getElementById('mic-btn');
  if (btn) btn.classList.remove('listening');
}

function updateStatus(msg, active) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar' + (active ? ' active' : '');
}

// ── Init ────────────────────────────────────────────
renderTypeList();
renderDecadePicker();

// Pre-select today's rosary mystery
(function preselect() {
  const dayMystery = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'}[new Date().getDay()];
  const rosaryCard = document.querySelector('[data-type="rosary"]');
  if (rosaryCard) selectType(rosaryCard);
  const mysteryBtn = document.querySelector('[data-mystery="' + dayMystery + '"]');
  if (mysteryBtn) selectMystery(mysteryBtn);
})();
</script>
