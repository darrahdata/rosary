<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rosary — A Contemplative Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ivory:        #f8f5f0;
  --ivory-dark:   #eee9e0;
  --ivory-border: #d8d2c8;
  --white:        #ffffff;
  --blue:         #4a6fa5;
  --blue-dark:    #2c4a7c;
  --blue-mid:     #3d5c8e;
  --blue-light:   #8aaac8;
  --blue-pale:    #edf2f8;
  --blue-border:  #b8cce0;
  --text:         #1e2d40;
  --text-muted:   #6a7d8f;
  --text-light:   #9aaab8;
}

body {
  font-family: 'EB Garamond', Georgia, serif;
  background: var(--ivory);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.25rem 1.25rem 5rem;
}

/* ── Header ─────────────────────────────────────── */
.app-header {
  text-align: center;
  margin-bottom: 2.5rem;
}
.app-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(1.9rem, 5vw, 2.7rem);
  letter-spacing: 0.1em;
  color: var(--blue-dark);
}
.app-header p {
  font-style: italic;
  font-size: 0.97rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
}
.header-rule {
  width: 44px;
  height: 2px;
  background: var(--blue);
  opacity: 0.3;
  margin: 0.9rem auto 0;
  border-radius: 1px;
}

.screen { display: none; width: 100%; max-width: 520px; }
.screen.active { display: block; }

/* ── Setup Screen ────────────────────────────────── */
.setup-section { margin-bottom: 1.75rem; }
.setup-label {
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.85rem;
}

.mystery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.mystery-card {
  background: var(--white);
  border: 1.5px solid var(--ivory-border);
  border-radius: 10px;
  padding: 1.1rem 1rem 1rem;
  cursor: pointer;
  text-align: left;
  font-family: 'EB Garamond', serif;
  font-size: 1.07rem;
  color: var(--text);
  line-height: 1.3;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.mystery-card:hover {
  border-color: var(--blue-border);
  background: var(--blue-pale);
  box-shadow: 0 2px 10px rgba(74,111,165,0.08);
}
.mystery-card.selected {
  border-color: var(--blue);
  background: var(--blue-pale);
  color: var(--blue-dark);
  box-shadow: 0 2px 14px rgba(74,111,165,0.14);
}
.mystery-card small {
  display: block;
  font-size: 0.78rem;
  color: var(--text-light);
  font-style: italic;
  margin-top: 4px;
}
.mystery-card.selected small { color: var(--blue); }

.advance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.advance-btn {
  background: var(--white);
  border: 1.5px solid var(--ivory-border);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  font-family: 'EB Garamond', serif;
  font-size: 1.02rem;
  color: var(--text);
  text-align: left;
  line-height: 1.3;
  transition: border-color 0.2s, background 0.2s;
}
.advance-btn:hover { border-color: var(--blue-border); background: var(--blue-pale); }
.advance-btn.selected {
  border-color: var(--blue);
  background: var(--blue-pale);
  color: var(--blue-dark);
}
.advance-btn small {
  display: block;
  font-size: 0.78rem;
  color: var(--text-light);
  font-style: italic;
  margin-top: 3px;
}
.advance-btn.selected small { color: var(--blue); }

.start-btn {
  width: 100%;
  padding: 1.05rem 1.5rem;
  background: var(--blue);
  color: var(--white);
  border: none;
  border-radius: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: 0.14em;
  cursor: pointer;
  margin-top: 1.75rem;
  transition: background 0.2s, box-shadow 0.2s;
  box-shadow: 0 3px 14px rgba(74,111,165,0.22);
}
.start-btn:hover { background: var(--blue-dark); box-shadow: 0 5px 18px rgba(44,74,124,0.28); }
.start-btn:disabled {
  background: var(--ivory-border);
  color: var(--text-light);
  cursor: default;
  box-shadow: none;
}

/* ── Prayer Screen ───────────────────────────────── */
.back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'EB Garamond', serif;
  font-size: 0.9rem;
  cursor: pointer;
  padding: 0;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--blue); }

.prayer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
}
.mystery-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--blue-dark);
}
.progress-text {
  font-size: 0.78rem;
  color: var(--text-light);
  letter-spacing: 0.05em;
}

#rosary-svg {
  width: 100%;
  max-width: 300px;
  margin: 0.1rem auto 0.6rem;
  display: block;
  overflow: visible;
}

/* SVG bead styling */
.rb-chain { fill: none; stroke: #c4cdd8; stroke-width: 1.2; }
.rb-bead { transition: filter 0.45s; }
.rb-bead circle {
  fill: url(#grad-undone);
  stroke: #c0bab2;
  stroke-width: 1.2;
  transition: fill 0.45s, stroke 0.45s;
}
.rb-bead.done circle { fill: url(#grad-done); stroke: #6a90b8; }
.rb-bead.current circle { fill: url(#grad-current); stroke: #2c4a7c; stroke-width: 1.6; }
.rb-bead.current { animation: bead-glow 2s ease-in-out infinite; }
@keyframes bead-glow {
  0%,100% { filter: drop-shadow(0 0 3px rgba(74,111,165,0.35)); }
  50%      { filter: drop-shadow(0 0 9px rgba(74,111,165,0.75)); }
}
.rb-cross { transition: filter 0.45s; }
.rb-cross line {
  stroke: #c4cdd8;
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke 0.45s;
}
.rb-cross.done line { stroke: var(--blue); }
.rb-cross.current line { stroke: var(--blue-dark); }
.rb-cross.current { animation: bead-glow 2s ease-in-out infinite; }

.prayer-card {
  background: var(--white);
  border: 1px solid var(--ivory-border);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  min-height: 120px;
  box-shadow: 0 1px 8px rgba(30,45,64,0.05);
}
.prayer-type {
  font-size: 0.67rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 0.4rem;
}
.prayer-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.55rem;
  color: var(--blue-dark);
  margin-bottom: 0.7rem;
  font-style: italic;
  line-height: 1.2;
}
.prayer-text {
  font-size: 1.02rem;
  line-height: 1.78;
  color: var(--text);
}
.mystery-text {
  font-size: 0.9rem;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 0.8rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--ivory-dark);
}

.controls {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 0.7rem;
}
.ctrl-btn {
  flex: 1;
  padding: 0.95rem 1rem;
  border-radius: 10px;
  font-family: 'EB Garamond', serif;
  font-size: 1.05rem;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 54px;
}
.btn-prev {
  background: var(--white);
  border: 1.5px solid var(--ivory-border);
  color: var(--text-muted);
}
.btn-prev:hover { border-color: var(--blue-border); color: var(--blue); }
.btn-next {
  background: var(--blue);
  border: 1.5px solid var(--blue);
  color: var(--white);
  box-shadow: 0 2px 10px rgba(74,111,165,0.22);
}
.btn-next:hover { background: var(--blue-dark); border-color: var(--blue-dark); }

.mic-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 1.5px solid var(--ivory-border);
  background: var(--white);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  box-shadow: 0 1px 4px rgba(30,45,64,0.06);
}
.mic-btn:hover { border-color: var(--blue-border); color: var(--blue); }
.mic-btn.listening {
  border-color: #d9533a;
  color: #d9533a;
  animation: mic-pulse 1.5s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(217,83,58,0); }
  50%      { box-shadow: 0 0 0 6px rgba(217,83,58,0.12); }
}

.status-bar {
  font-size: 0.82rem;
  color: var(--text-light);
  text-align: center;
  min-height: 1.2em;
  font-style: italic;
}
.status-bar.active { color: var(--blue); }

/* ── Complete Screen ─────────────────────────────── */
.complete-card {
  background: var(--white);
  border: 1px solid var(--ivory-border);
  border-radius: 14px;
  padding: 2.75rem 2rem;
  text-align: center;
  box-shadow: 0 2px 18px rgba(30,45,64,0.06);
}
.complete-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.1rem;
  color: var(--blue-dark);
  font-weight: 400;
  margin-bottom: 0.9rem;
}
.complete-rule {
  width: 38px;
  height: 1.5px;
  background: var(--blue);
  opacity: 0.28;
  margin: 0 auto 1rem;
  border-radius: 1px;
}
.complete-card p { color: var(--text-muted); font-style: italic; line-height: 1.7; }
.restart-btn {
  margin-top: 1.75rem;
  padding: 0.85rem 2.25rem;
  background: transparent;
  border: 1.5px solid var(--blue);
  color: var(--blue-dark);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-weight: 400;
  cursor: pointer;
  border-radius: 10px;
  letter-spacing: 0.06em;
  transition: all 0.2s;
}
.restart-btn:hover { background: var(--blue); color: var(--white); }
</style>
</head>
<body>

<header class="app-header">
  <h1>The Rosary</h1>
  <p>A contemplative companion for prayer</p>
  <div class="header-rule"></div>
</header>

<!-- ── Setup Screen ─────────────────────────────── -->
<div class="screen active" id="screen-setup">

  <div class="setup-section">
    <div class="setup-label">Choose mysteries</div>
    <div class="mystery-grid">
      <button class="mystery-card" data-mystery="joyful" onclick="selectOption(this,'mystery')">
        Joyful<small>Monday &amp; Saturday</small>
      </button>
      <button class="mystery-card" data-mystery="sorrowful" onclick="selectOption(this,'mystery')">
        Sorrowful<small>Tuesday &amp; Friday</small>
      </button>
      <button class="mystery-card" data-mystery="glorious" onclick="selectOption(this,'mystery')">
        Glorious<small>Wednesday &amp; Sunday</small>
      </button>
      <button class="mystery-card" data-mystery="luminous" onclick="selectOption(this,'mystery')">
        Luminous<small>Thursday</small>
      </button>
    </div>
  </div>

  <div class="setup-section">
    <div class="setup-label">Advance beads by</div>
    <div class="advance-grid">
      <button class="advance-btn selected" data-advance="tap" onclick="selectOption(this,'advance')">
        Tap / click<small>Manual advance</small>
      </button>
      <button class="advance-btn" data-advance="voice" onclick="selectOption(this,'advance')">
        Voice<small>Auto-advance as you pray</small>
      </button>
    </div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startRosary()" disabled>Begin</button>
</div>

<!-- ── Prayer Screen ─────────────────────────────── -->
<div class="screen" id="screen-prayer">
  <button class="back-btn" onclick="showSetup()">&#8592; back</button>
  <div class="prayer-header">
    <span class="mystery-name" id="mystery-label"></span>
    <span class="progress-text" id="progress-label"></span>
  </div>

  <svg id="rosary-svg" viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="prayer-card">
    <div class="prayer-type" id="prayer-type"></div>
    <div class="prayer-name" id="prayer-name"></div>
    <div class="prayer-text" id="prayer-text"></div>
    <div class="mystery-text" id="mystery-text" style="display:none"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-prev" onclick="prevBead()">&#8592; prev</button>
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Toggle voice">
      <svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="1" width="6" height="11" rx="3"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="ctrl-btn btn-next" onclick="nextBead()">next &#8594;</button>
  </div>

  <div class="status-bar" id="status-bar">Tap &#8220;next&#8221; or use voice to advance</div>
</div>

<!-- ── Complete Screen ───────────────────────────── -->
<div class="screen" id="screen-complete">
  <div class="complete-card">
    <h2>Rosary Complete</h2>
    <div class="complete-rule"></div>
    <p>&#8220;The Rosary is the weapon for these times.&#8221;<br><em>&#8212; Padre Pio</em></p>
    <button class="restart-btn" onclick="showSetup()">Pray again</button>
  </div>
</div>

<script>
const MYSTERIES = {
  joyful: {
    name: 'Joyful Mysteries',
    list: ['The Annunciation','The Visitation','The Nativity','The Presentation','The Finding in the Temple']
  },
  sorrowful: {
    name: 'Sorrowful Mysteries',
    list: ['The Agony in the Garden','The Scourging at the Pillar','The Crowning with Thorns','The Carrying of the Cross','The Crucifixion']
  },
  glorious: {
    name: 'Glorious Mysteries',
    list: ['The Resurrection','The Ascension','The Descent of the Holy Spirit','The Assumption of Mary','The Coronation of Mary']
  },
  luminous: {
    name: 'Luminous Mysteries',
    list: ['The Baptism of the Lord','The Wedding at Cana','The Proclamation of the Kingdom','The Transfiguration','The Institution of the Eucharist']
  }
};

const PRAYERS = {
  apostlesCreed:  { type: 'Opening prayer',  name: "Apostles' Creed",   text: "I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen." },
  ourFather:      { type: 'Our Father bead', name: 'Our Father',         text: "Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen." },
  hailMary:       { type: 'Hail Mary bead',  name: 'Hail Mary',          text: "Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen." },
  gloryBe:        { type: 'Glory Be',         name: 'Glory Be',           text: "Glory be to the Father, and to the Son, and to the Holy Spirit; as it was in the beginning, is now, and ever shall be, world without end. Amen." },
  fatima:         { type: 'Fatima Prayer',    name: 'O My Jesus',         text: "O my Jesus, forgive us our sins, save us from the fires of hell, lead all souls to Heaven, especially those most in need of Thy mercy. Amen." },
  hailHolyQueen:  { type: 'Closing prayer',  name: 'Hail, Holy Queen',   text: "Hail, Holy Queen, Mother of Mercy! Our life, our sweetness, and our hope! To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious Advocate, thine eyes of mercy toward us; and after this our exile show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary. Pray for us, O holy Mother of God, that we may be made worthy of the promises of Christ. Amen." }
};

function buildSequence(key) {
  const mysteries = MYSTERIES[key].list;
  let seq = [];
  seq.push({ ...PRAYERS.apostlesCreed, bead: 'cross' });
  seq.push({ ...PRAYERS.ourFather,     bead: 'large' });
  seq.push({ ...PRAYERS.hailMary,      bead: 'small', sub: 'For an increase in Faith' });
  seq.push({ ...PRAYERS.hailMary,      bead: 'small', sub: 'For an increase in Hope' });
  seq.push({ ...PRAYERS.hailMary,      bead: 'small', sub: 'For an increase in Charity' });
  seq.push({ ...PRAYERS.gloryBe,       bead: 'chain' });
  for (let d = 0; d < 5; d++) {
    seq.push({ ...PRAYERS.ourFather, bead: 'large', mystery: mysteries[d], decade: d + 1 });
    for (let h = 0; h < 10; h++) {
      seq.push({ ...PRAYERS.hailMary, bead: 'small', mystery: mysteries[d] });
    }
    seq.push({ ...PRAYERS.gloryBe, bead: 'chain', mystery: mysteries[d] });
    seq.push({ ...PRAYERS.fatima,  bead: 'chain', mystery: mysteries[d] });
  }
  seq.push({ ...PRAYERS.hailHolyQueen, bead: 'chain' });
  return seq;
}

let state = { mysteryKey: null, advanceMode: 'tap', sequence: [], currentIndex: 0, listening: false };
let selections = { mystery: null, advance: 'tap' };
let recog = null;
let svgBuilt = false;

function selectOption(btn, group) {
  document.querySelectorAll('[data-' + group + ']').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections[group] = btn.dataset[group];
  updateStartBtn();
}

function updateStartBtn() {
  document.getElementById('start-btn').disabled = !selections.mystery;
}

function startRosary() {
  state.mysteryKey   = selections.mystery;
  state.advanceMode  = selections.advance;
  state.sequence     = buildSequence(state.mysteryKey);
  state.currentIndex = 0;
  state.listening    = false;
  svgBuilt = false;
  showScreen('screen-prayer');
  renderPrayer();
  if (state.advanceMode === 'voice') setTimeout(() => startListening(), 500);
}

function showSetup() {
  stopListening();
  showScreen('screen-setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderPrayer() {
  const step = state.sequence[state.currentIndex];
  document.getElementById('mystery-label').textContent  = MYSTERIES[state.mysteryKey].name;
  document.getElementById('progress-label').textContent = (state.currentIndex + 1) + ' / ' + state.sequence.length;
  document.getElementById('prayer-type').textContent    = step.type || '';
  document.getElementById('prayer-name').textContent    = step.name || '';
  document.getElementById('prayer-text').textContent    = step.text || '';
  const mystEl = document.getElementById('mystery-text');
  if (step.mystery) {
    mystEl.style.display = 'block';
    mystEl.textContent = (step.decade ? step.decade + '. ' : '') + step.mystery;
  } else if (step.sub) {
    mystEl.style.display = 'block';
    mystEl.textContent = step.sub;
  } else {
    mystEl.style.display = 'none';
  }
  renderBeads();
}

// ── SVG Rosary ────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const R_CX = 170, R_CY = 148, R_RX = 125, R_RY = 102, R_JY = 250;

const PENDANT_POS = [
  { seq: 5, y: 276, r: 4.5 },
  { seq: 4, y: 298, r: 4.5 },
  { seq: 3, y: 318, r: 4.5 },
  { seq: 2, y: 338, r: 4.5 },
  { seq: 1, y: 362, r: 7   },
];
const OF_CIRCLE = new Set([0, 13, 26, 39, 52]);

function mkEl(tag) { return document.createElementNS(SVG_NS, tag); }

function addBead(svg, seqIdx, x, y, r) {
  const g = mkEl('g');
  g.setAttribute('id', 'rb-' + seqIdx);
  g.setAttribute('class', 'rb-bead');
  const c = mkEl('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  g.appendChild(c);
  svg.appendChild(g);
}

function buildRosarySVG() {
  const svg = document.getElementById('rosary-svg');
  svg.innerHTML = '';

  const defs = mkEl('defs');
  defs.innerHTML = `
    <radialGradient id="grad-undone" cx="35%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#beb8b0"/>
    </radialGradient>
    <radialGradient id="grad-done" cx="35%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#ddeaf8"/>
      <stop offset="55%"  stop-color="#8aaac8"/>
      <stop offset="100%" stop-color="#3d5c8e"/>
    </radialGradient>
    <radialGradient id="grad-current" cx="32%" cy="26%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#c8dcf2"/>
      <stop offset="100%" stop-color="#2c4a7c"/>
    </radialGradient>`;
  svg.appendChild(defs);

  // Main ellipse chain
  const ell = mkEl('ellipse');
  ell.setAttribute('cx', R_CX); ell.setAttribute('cy', R_CY);
  ell.setAttribute('rx', R_RX); ell.setAttribute('ry', R_RY);
  ell.setAttribute('class', 'rb-chain');
  svg.appendChild(ell);

  // Pendant chain lines
  const chainYs = [R_JY, ...PENDANT_POS.map(p => p.y), 383];
  for (let i = 0; i < chainYs.length - 1; i++) {
    const ln = mkEl('line');
    ln.setAttribute('x1', R_CX); ln.setAttribute('y1', chainYs[i]);
    ln.setAttribute('x2', R_CX); ln.setAttribute('y2', chainYs[i + 1]);
    ln.setAttribute('class', 'rb-chain');
    svg.appendChild(ln);
  }

  // Cross (sequence index 0)
  const crossG = mkEl('g');
  crossG.setAttribute('id', 'rb-0');
  crossG.setAttribute('class', 'rb-cross');
  const vBar = mkEl('line');
  vBar.setAttribute('x1', R_CX);      vBar.setAttribute('y1', 383);
  vBar.setAttribute('x2', R_CX);      vBar.setAttribute('y2', 414);
  const hBar = mkEl('line');
  hBar.setAttribute('x1', R_CX - 12); hBar.setAttribute('y1', 391);
  hBar.setAttribute('x2', R_CX + 12); hBar.setAttribute('y2', 391);
  crossG.appendChild(vBar); crossG.appendChild(hBar);
  svg.appendChild(crossG);

  // Junction bead at top of pendant (seq 71)
  addBead(svg, 71, R_CX, R_JY, 9);

  // Pendant beads (seqs 1–5)
  for (const p of PENDANT_POS) addBead(svg, p.seq, R_CX, p.y, p.r);

  // Circle beads (seqs 6–70), counter-clockwise from bottom junction
  const step = (2 * Math.PI) / 66;
  for (let i = 0; i < 65; i++) {
    const angle = Math.PI / 2 + (i + 1) * step;
    addBead(svg, 6 + i,
      R_CX + R_RX * Math.cos(angle),
      R_CY + R_RY * Math.sin(angle),
      OF_CIRCLE.has(i) ? 7 : 4.5);
  }

  svgBuilt = true;
}

function renderBeads() {
  if (!svgBuilt) buildRosarySVG();
  const idx = state.currentIndex;

  const cross = document.getElementById('rb-0');
  if (cross) cross.setAttribute('class',
    'rb-cross' + (idx === 0 ? ' current' : idx > 0 ? ' done' : ''));

  for (let s = 1; s <= 71; s++) {
    const b = document.getElementById('rb-' + s);
    if (b) b.setAttribute('class',
      'rb-bead' + (s === idx ? ' current' : s < idx ? ' done' : ''));
  }
}

function nextBead() {
  if (state.currentIndex < state.sequence.length - 1) {
    state.currentIndex++;
    renderPrayer();
  } else {
    stopListening();
    showScreen('screen-complete');
  }
}

function prevBead() {
  if (state.currentIndex > 0) { state.currentIndex--; renderPrayer(); }
}

// ── Voice Recognition ─────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleMic() {
  if (state.listening) {
    stopListening();
    updateStatus('Voice paused — tap next or enable voice again', false);
  } else {
    startListening();
  }
}

function startListening() {
  if (!SpeechRecognition) { updateStatus('Voice not supported — use Chrome or Edge', false); return; }
  if (recog) { try { recog.stop(); } catch(e){} }
  recog = new SpeechRecognition();
  recog.continuous = true;
  recog.interimResults = false;
  recog.lang = 'en-US';
  recog.onstart = () => {
    state.listening = true;
    document.getElementById('mic-btn').classList.add('listening');
    updateStatus('Listening — pray aloud to advance', true);
  };
  recog.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal && last[0].transcript.trim().length > 8) nextBead();
  };
  recog.onerror = (e) => {
    if (e.error !== 'no-speech') {
      state.listening = false;
      document.getElementById('mic-btn').classList.remove('listening');
      updateStatus('Voice error — tap mic to retry', false);
    }
  };
  recog.onend = () => {
    if (state.listening) { try { recog.start(); } catch(e){} }
    else { document.getElementById('mic-btn').classList.remove('listening'); }
  };
  try { recog.start(); } catch(e) { updateStatus('Could not start microphone', false); }
}

function stopListening() {
  state.listening = false;
  if (recog) { try { recog.stop(); } catch(e){} recog = null; }
  const btn = document.getElementById('mic-btn');
  if (btn) btn.classList.remove('listening');
}

function updateStatus(msg, active) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar' + (active ? ' active' : '');
}

// Pre-select today's mystery
const dayMystery = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'}[new Date().getDay()];
const todayBtn = document.querySelector('[data-mystery="' + dayMystery + '"]');
if (todayBtn) { todayBtn.classList.add('selected'); selections.mystery = dayMystery; updateStartBtn(); }
</script>
